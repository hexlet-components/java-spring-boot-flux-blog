[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless-plugin" }
lombok = { id = "io.freefair.lombok", version.ref = "lombok-plugin" }
versions = { id = "io.github.ben-manes.versions", version.ref = "versions-plugin" }
version-catalog-update = { id = "nl.littlerobots.version-catalog-update", version.ref = "catalog-update-plugin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
test-logger = { id = "com.adarshr.test-logger", version.ref = "test-logger-plugin" }

[versions]
spotless-plugin = "8.9.0"
lombok-plugin = "9.5.0"
versions-plugin = "0.61.0"
catalog-update-plugin = "1.1.1"
spring-boot = "4.1.0"
spring-dependency-management = "1.1.7"
test-logger-plugin = "4.0.0"

[libraries]
# Spring Boot: версии управляет io.spring.dependency-management
springBootStarterWebflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
springBootStarterDataR2dbc = { module = "org.springframework.boot:spring-boot-starter-data-r2dbc" }
springBootStarterJdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
springBootStarterTest = { module = "org.springframework.boot:spring-boot-starter-test" }
springBootStarterWebfluxTest = { module = "org.springframework.boot:spring-boot-starter-webflux-test" }
# В Spring Boot 4 автоконфигурации разъехались по модулям, и голый liquibase-core
# её больше не приносит: миграции молча не запускаются.
springBootStarterLiquibase = { module = "org.springframework.boot:spring-boot-starter-liquibase" }
reactorTest = { module = "io.projectreactor:reactor-test" }
# Database
r2dbcH2 = { module = "io.r2dbc:r2dbc-h2" }
h2 = { module = "com.h2database:h2" }

spring:
  r2dbc:
    url: r2dbc:h2:mem:///testdb?options=CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
  liquibase:
    user: sa
    password:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    change-log: classpath:db/changelog/db.changelog-test.yaml
    enabled: true
  # Фикстуру наливает liquibase из того же data.sql, поэтому инициализатор
  # скриптов выключен: иначе данные вставились бы дважды.
  sql:
    init:
      mode: never
